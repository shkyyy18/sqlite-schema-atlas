[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "sqlite-schema-atlas"
version = "0.1.0"
description = "Read-only SQLite schema inventory and comparison"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "sqlite-schema-atlas contributors"}]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]
[project.scripts]
sqlite-schema-atlas = "sqlite_schema_atlas.__main__:cli"
[project.urls]
Repository = "https://github.com/shkyyy18/sqlite-schema-atlas"
[tool.setuptools.packages.find]
where = ["src"]
